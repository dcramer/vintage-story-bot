<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diggy Smalls fleet</title>
<style>
:root { color-scheme: light; --bg:#f4f4f2; --surface:#fcfcfb; --line:#dddcd7; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984;
  --good:#1baf7a; --warn:#eda100; --bad:#e34948; --accent:#2a78d6; --track:#e8e7e3; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#121211; --surface:#1a1a19; --line:#2e2e2b; --ink:#fff; --ink2:#c3c2b7; --muted:#7f7e78;
  --good:#199e70; --warn:#c98500; --bad:#e66767; --accent:#3987e5; --track:#2a2a28; } }
* { box-sizing: border-box; }
body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
header { display:flex; flex-wrap:wrap; gap:8px 20px; align-items:baseline; margin-bottom:12px; }
h1 { font-size:18px; margin:0; }
.pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink2); }
.pill::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--muted); }
.pill.on::before { background:var(--good); } .pill.off::before { background:var(--bad); } .pill.warn::before { background:var(--warn); }
main { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); }
section { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; }
section.wide { grid-column: 1 / -1; }
section.stale { opacity:.6; }
h2 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink2); margin:0 0 8px; }
.head { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; margin-bottom:8px; }
.head b { font-size:18px; overflow-wrap:anywhere; }
.goal { margin:8px 0; }
.goal .kind { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink2); margin-right:6px; }
.goal .title { font-size:15px; overflow-wrap:anywhere; }
.goal .phase { color:var(--accent); }
dl { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:8px 0 0; }
dt { color:var(--ink2); } dd { margin:0; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.meter { display:grid; grid-template-columns:56px 1fr 72px; gap:8px; align-items:center; margin:3px 0; }
.meter .bar { height:8px; background:var(--track); border-radius:4px; overflow:hidden; }
.meter .bar i { display:block; height:100%; background:var(--accent); border-radius:4px; transition:width .3s; }
.meter.warn .bar i { background:var(--warn); } .meter.bad .bar i { background:var(--bad); }
.meter .value { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink2); }
.tags span { display:inline-block; font-size:12px; padding:1px 6px; border:1px solid var(--line); border-radius:4px; margin:2px 4px 2px 0; color:var(--ink2); }
.tags span.bad { border-color:var(--bad); color:var(--bad); } .tags span.good { border-color:var(--good); color:var(--good); } .tags span.warn { border-color:var(--warn); color:var(--warn); }
.hotbar { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
.hotbar span { font-size:11px; padding:2px 5px; border:1px solid var(--line); border-radius:4px; color:var(--ink2); }
.hotbar span.active { border-color:var(--accent); color:var(--ink); }
table { width:100%; border-collapse:collapse; font-size:12px; }
td, th { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); vertical-align:top; font-variant-numeric:tabular-nums; }
th { color:var(--ink2); font-weight:600; }
td.ok { color:var(--good); } td.err { color:var(--bad); }
.scroll { max-height:360px; overflow:auto; }
.log td:last-child { color:var(--ink2); overflow-wrap:anywhere; }
.muted { color:var(--muted); }
.empty { grid-column:1 / -1; color:var(--muted); padding:24px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Diggy Smalls fleet</h1>
  <span class="pill" id="link">connecting</span>
  <span class="pill" id="count">no bots</span>
</header>
<main id="bots"></main>
<section class="wide" style="margin-top:12px">
  <h2>Log</h2>
  <div class="scroll"><table class="log" id="log"><thead><tr><th>Time</th><th>Bot</th><th>Topic</th><th>Detail</th></tr></thead><tbody></tbody></table></div>
</section>
<script>
const $ = id => document.getElementById(id);
const bots = new Map(); let retentionMs = 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = v => v == null ? '—' : typeof v === 'number' ? (Number.isInteger(v) ? String(v) : v.toFixed(2))
  : Array.isArray(v) ? JSON.stringify(v) : typeof v === 'object' ? Object.entries(v).map(([k, x]) => `${k}: ${fmt(x)}`).join(' · ') : String(v);
const time = at => new Date(at).toLocaleTimeString([], { hour12: false });
const code = c => typeof c === 'string' ? c.replace(/^game:/, '') : c;
const point = p => p && p.x != null ? [p.x, p.y, p.z].map(v => v == null ? '?' : Math.round(v)).join(', ') : null;
const ago = at => { const s = Math.max(0, Math.round((Date.now() - at) / 1000)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m ago`; };
const tag = (text, cls = '') => `<span class="${cls}">${esc(text)}</span>`;
const stateClass = s => s === 'arrived' || s === 'completed' ? 'good' : s === 'blocked' || s === 'cancelled' || s === 'failed' ? 'bad' : '';
function meter(name, vital, lowAt) {
  const pct = vital?.max ? Math.max(0, Math.min(1, vital.current / vital.max)) : null;
  const level = pct == null ? '' : pct <= lowAt ? 'bad' : pct <= lowAt + .2 ? 'warn' : '';
  const value = pct == null ? 'unknown' : `${vital.current.toFixed(1)} / ${vital.max.toFixed(0)}`;
  return `<div class="meter ${level}"><span>${name}</span><div class="bar"><i style="width:${(pct ?? 0) * 100}%"></i></div><span class="value">${value}</span></div>`;
}
const goalTitle = g => g?.args ? fmt(g.args) : '';
function goalHtml(g) {
  if (!g) return '<div class="goal"><span class="kind">no goal</span></div>';
  const p = g.progress ?? {}, detail = Object.entries(p).filter(([k]) => k !== 'phase').map(([k, v]) => `${k} ${typeof v === 'object' ? point(v) ?? fmt(v) : code(fmt(v))}`).join(' · ');
  return `<div class="goal"><span class="kind">${esc(g.kind.replace(/_/g, ' '))}</span><span class="title">${esc(goalTitle(g))}</span> <span class="tags">${tag(g.state, stateClass(g.state))}${g.active ? tag('active', 'good') : ''}</span>` +
    `<div>${p.phase ? `<span class="phase">${esc(p.phase.replace(/_/g, ' '))}</span>${detail ? ' — ' + esc(detail) : ''}` : g.reason ? `<span class="muted">${esc(g.reason)}</span>` : ''}</div></div>`;
}
function botHtml(bot) {
  const s = bot.topics.state?.data ?? {}, g = bot.topics.goal?.data, n = bot.topics.navigation?.data, c = bot.topics.controller?.data;
  const age = Date.now() - bot.seenAt, live = age < 30000;
  const tags = [tag(s.life?.state ?? (s.alive == null ? 'unknown' : s.alive ? 'alive' : 'dead'), s.alive ? 'good' : 'bad'), s.controlReady != null ? tag(s.controlReady ? 'control ready' : 'no control', s.controlReady ? 'good' : 'bad') : ''];
  if (s.paused) tags.push(tag('paused', 'bad'));
  for (const a of s.life?.alerts ?? []) tags.push(tag(a, 'bad'));
  if (s.condition?.onFire) tags.push(tag('on fire', 'bad'));
  if (s.condition?.temporalStorm?.phase && s.condition.temporalStorm.phase !== 'none') tags.push(tag('storm ' + s.condition.temporalStorm.phase, 'warn'));
  if (n?.evading) tags.push(tag('evading', 'warn'));
  const rows = [['player', s.player ? `${s.player.name}` : null], ['world', s.world ? `${s.world.singleplayer ? 'singleplayer' : 'multiplayer'} · ${s.world.gameMode}` : null],
    ['position', s.position ? `${point(s.position)}${s.position.dimension ? ' (dim ' + s.position.dimension + ')' : ''}` : null],
    ['navigation', n && n.state !== 'idle' ? `${n.state}${n.target ? ' → ' + point(n.target) : ''}${n.remainingWaypoints != null ? ' · ' + n.remainingWaypoints + ' wp' : ''}${n.reason ? ' · ' + n.reason : ''}` : 'idle'],
    ['nearby', s.nearbyEntities ? `${s.nearbyEntities.count}${s.nearbyEntities.nearest?.length ? ': ' + s.nearbyEntities.nearest.map(e => `${code(e.code)} ${Math.round(e.distance)}`).join(', ') : ''}` : null],
    ['stability', s.condition?.temporalStability], ['lives left', s.life?.livesRemaining], ['last damage', s.life?.lastDamageAt ? time(s.life.lastDamageAt) : null],
    ['host', bot.meta?.host], ['session', c?.session ? c.session.slice(0, 8) : null], ['observed', s.observedAt ? time(s.observedAt) : null]].filter(([, v]) => v != null);
  const hotbar = (s.hotbar ?? []).map(slot => `<span class="${slot.slot === s.activeSlot ? 'active' : ''}">${slot.slot} ${slot.code ? esc(code(slot.code)) + (slot.quantity > 1 ? ' ×' + slot.quantity : '') : '<i class="muted">empty</i>'}</span>`).join('');
  return `<section class="${live ? '' : 'stale'}" data-bot="${esc(bot.id)}"><div class="head"><b>${esc(bot.id)}</b><span class="pill ${live ? 'on' : 'off'}" data-seen="${bot.seenAt}">${ago(bot.seenAt)}</span></div>` +
    goalHtml(g) + meter('health', s.vitals?.health, .3) + meter('hunger', s.vitals?.hunger, .2) + meter('oxygen', s.vitals?.oxygen, .2) +
    `<div class="tags">${tags.join('')}</div><dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(fmt(v))}</dd>`).join('')}</dl><div class="hotbar">${hotbar}</div></section>`;
}
function logDetail(e) {
  const d = e.data ?? {};
  if (e.topic === 'action') return `${d.action} ${d.ok ? '' : '✗ ' + (d.error ?? d.code ?? '')} ${JSON.stringify(d.args ?? {})}`;
  if (e.topic === 'goal') return `${d.kind} ${goalTitle(d)} ${d.state}${d.reason ? ' — ' + d.reason : ''}${d.progress?.phase ? ' · ' + d.progress.phase : ''}`;
  return JSON.stringify(d);
}
function render() {
  const list = [...bots.values()].sort((a, b) => b.seenAt - a.seenAt);
  $('bots').innerHTML = list.length ? list.map(botHtml).join('') : '<div class="empty">No bots have reported' + (retentionMs ? ` in the last ${Math.round(retentionMs / 3600000)}h` : '') + '.</div>';
  const live = list.filter(b => Date.now() - b.seenAt < 30000).length;
  $('count').textContent = list.length ? `${live} live / ${list.length} known` : 'no bots';
  $('count').className = 'pill ' + (live ? 'on' : list.length ? 'off' : '');
  const rows = list.flatMap(b => b.log.map(e => ({ ...e, bot: b.id }))).sort((a, b) => b.at - a.at).slice(0, 300);
  $('log').tBodies[0].innerHTML = rows.map(e => { const bad = e.data?.ok === false || ['blocked', 'cancelled', 'failed'].includes(e.data?.state);
    return `<tr><td>${time(e.at)}</td><td>${esc(e.bot)}</td><td class="${bad ? 'err' : ''}">${esc(e.topic)}</td><td>${esc(logDetail(e))}</td></tr>`; }).join('');
}
function apply(message) {
  if (message.type === 'snapshot') { bots.clear(); retentionMs = message.retentionMs; for (const bot of message.bots) bots.set(bot.id, bot); }
  else if (message.type === 'bot') bots.set(message.bot.id, message.bot);
  else if (message.type === 'gone') bots.delete(message.id);
  else return;
  render();
}
let socket, retry = 1000;
function connect() {
  socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/ws`);
  socket.onopen = () => { retry = 1000; $('link').className = 'pill on'; $('link').textContent = 'live'; };
  socket.onmessage = e => { if (e.data !== 'pong') apply(JSON.parse(e.data)); };
  socket.onclose = () => { $('link').className = 'pill off'; $('link').textContent = 'reconnecting'; setTimeout(connect, retry); retry = Math.min(retry * 2, 30000); };
  socket.onerror = () => socket.close();
}
fetch('/api/state').then(r => r.json()).then(s => apply({ type: 'snapshot', ...s })).catch(() => {});
connect();
setInterval(() => { if (socket?.readyState === 1) socket.send('ping'); }, 30000);
setInterval(() => { for (const el of document.querySelectorAll('[data-seen]')) { const at = Number(el.dataset.seen), live = Date.now() - at < 30000;
  el.textContent = ago(at); el.className = 'pill ' + (live ? 'on' : 'off'); el.closest('section').classList.toggle('stale', !live); } }, 1000);
</script>
</body>
</html>
